[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot-local"
version = "0.1.0"
description = "Local read-only Polymarket data, labeling, and dashboard pipeline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["polybot*"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["../тесты"]

[tool.ruff]
line-length = 120
target-version = "py311"
